<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You 💖</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #ffd6e0, #ffeef3);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 16px;
}

/* TOP IMAGE */
.top-image {
  width: 85%;
  max-width: 340px;
  border-radius: 18px;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.18);
}

/* FIRST PAGE CARD */
.card {
  position: relative;
  background: white;
  padding: 30px;
  border-radius: 22px;
  text-align: center;
  width: 90%;
  max-width: 380px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.15);
}

/* GIF3 inside white box */
.header-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

.header-gif {
  width: 45px;
  height: 45px;
  object-fit: contain;
}

h2 {
  margin: 0;
  font-weight: 500;
}

h1 {
  font-size: 1.6rem;
  margin: 20px 0 26px 0;
}

/* Buttons side by side */
.button-row {
  display: flex;
  justify-content: center;
  gap: 20px;
}

button {
  padding: 14px 24px;
  font-size: 1rem;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  min-width: 120px;
}

#yes {
  background: #ff5c8d;
  color: white;
}

#no {
  background: #e0e0e0;
  color: #333;
  position: relative;
}

.outside-hint {
  margin-top: 16px;
  font-size: 0.95rem;
  color: black;
  opacity: 0;
  transition: opacity 0.4s ease;
  text-align: center;
}

/* PAGE 2 */
#page2 {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ffd6e0, #ffeef3);
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* BORDER PHOTOS */
.photo-border {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.border-photo {
  position: absolute;
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 18px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.2);
}

.top-left { top: 60px; left: 80px; transform: rotate(-6deg); }
.top-middle { top: 10px; left: 50%; transform: translateX(-50%) rotate(4deg); }
.top-right { top: 60px; right: 80px; transform: rotate(6deg); }

.bottom-left { bottom: 60px; left: 80px; transform: rotate(5deg); }
.bottom-middle { bottom: 10px; left: 50%; transform: translateX(-50%) rotate(-4deg); }
.bottom-right { bottom: 60px; right: 80px; transform: rotate(-5deg); }

.left-middle { top: 50%; left: 40px; transform: translateY(-50%) rotate(8deg); }
.right-middle { top: 50%; right: 40px; transform: translateY(-50%) rotate(-8deg); }

/* Celebration container */
.celebration-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
}

/* GIFs directly above white box */
.top-gif-row {
  display: flex;
  justify-content: space-between;
  width: 220px;
  margin-bottom: 10px;
}

.top-gif-row img {
  width: 55px;
  height: 55px;
  object-fit: contain;
}

/* Reduced width white box */
.celebration-box {
  background: white;
  width: 240px;  /* narrower */
  height: 340px;
  border-radius: 24px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.15);
  padding: 25px;
  display: flex;
  flex-direction: column;
  text-align: center;
}

.celebration-box h1 {
  font-size: 1.1rem;
  margin-bottom: 20px;
}

.photo-space {
  flex-grow: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.celebration-photo {
  width: 65%;
  object-fit: cover;
  border-radius: 18px;
}

/* Responsive */
@media (max-width: 600px) {

  .border-photo {
    width: 75px;
    height: 75px;
  }

  .celebration-box {
    width: 220px;
    height: 320px;
  }

  .top-gif-row {
    width: 200px;
  }

  .header-gif {
    width: 35px;
    height: 35px;
  }
}
</style>
</head>

<body>

<img src="proposal.jpeg" class="top-image" />

<div class="card" id="page1">

  <div class="header-row">
    <img src="gif3.gif" class="header-gif">
    <h2>Hieee bubuuuu</h2>
    <img src="gif3.gif" class="header-gif">
  </div>

  <h1>Will you be my Valentine? 💖 👉👈</h1>

  <div class="button-row">
    <button id="yes">Yes 💘</button>
    <button id="no">No<br><small>try me</small></button>
  </div>

</div>

<div class="outside-hint" id="hint">
  c'mon babess accept it
</div>

<div id="page2">

  <div class="photo-border">
    <img src="photo1.jpeg" class="border-photo top-left">
    <img src="photo7.jpeg" class="border-photo top-middle">
    <img src="photo2.jpeg" class="border-photo top-right">

    <img src="photo3.jpeg" class="border-photo bottom-left">
    <img src="photo8.jpeg" class="border-photo bottom-middle">
    <img src="photo4.jpeg" class="border-photo bottom-right">

    <img src="photo5.jpeg" class="border-photo left-middle">
    <img src="photo6.jpeg" class="border-photo right-middle">
  </div>

  <div class="celebration-wrapper">

    <div class="top-gif-row">
      <img src="gif1.gif">
      <img src="gif2.gif">
    </div>

    <div class="celebration-box">
      <h1>yayyyyyyyy i love youuuuu! 😘😘😘</h1>
      <div class="photo-space">
        <img src="proposal.jpeg" class="celebration-photo">
      </div>
    </div>

  </div>

</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const hint = document.getElementById("hint");

let dodgeCount = 0;

function moveNoButton() {
  dodgeCount++;

  const cardRect = document.querySelector(".card").getBoundingClientRect();
  const noRect = noBtn.getBoundingClientRect();
  const yesRect = yesBtn.getBoundingClientRect();

  const padding = 10;
  const minDistance = 120;

  let newX, newY;
  let attempts = 0;
  let valid = false;

  while (!valid && attempts < 50) {
    attempts++;

    newX = Math.random() * (cardRect.width - noRect.width - padding * 2) + padding;
    newY = Math.random() * (cardRect.height - noRect.height - padding * 2) + padding;

    const noCenterX = newX + noRect.width / 2;
    const noCenterY = newY + noRect.height / 2;

    const yesCenterX = yesBtn.offsetLeft + yesRect.width / 2;
    const yesCenterY = yesBtn.offsetTop + yesRect.height / 2;

    const distance = Math.hypot(
      noCenterX - yesCenterX,
      noCenterY - yesCenterY
    );

    if (distance > minDistance) valid = true;
  }

  noBtn.style.position = "absolute";
  noBtn.style.left = newX + "px";
  noBtn.style.top = newY + "px";

  if (dodgeCount === 10) hint.style.opacity = "1";
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton, { passive: true });

yesBtn.addEventListener("click", () => {
  document.getElementById("page1").style.display = "none";
  document.querySelector(".top-image").style.display = "none";
  hint.style.display = "none";
  document.getElementById("page2").style.display = "flex";

  confetti({
    particleCount: 220,
    spread: 90,
    origin: { y: 0.6 }
  });
});
</script>

</body>
</html>
